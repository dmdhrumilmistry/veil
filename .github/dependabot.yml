version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directories:
      - /flutter/veil_core
      - /flutter/app
    schedule:
      interval: weekly
    groups:
      pub-patches:
        update-types: [patch, minor]
