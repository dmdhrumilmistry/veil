name: Release

# Push a tag like v0.2.0 (matching app/package.json) to:
#   1. verify, test (unit + two-browser E2E) and build the app
#   2. publish a GitHub Release with zipped builds, SHA-256 checksums and signed build provenance
#   3. deploy the website (/) and app (/app/) to GitHub Pages (skipped for pre-releases like v1.0.0-rc.1)
#   4. publish the mailbox relay image to ghcr.io/<owner>/veil-relay (amd64 + arm64)

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check tag matches app/package.json version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="v$(node -p "require('./app/package.json').version")"
          if [ "$TAG" != "$pkg" ]; then
            echo "::error::Tag $TAG does not match app/package.json version $pkg"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Relay checks
        working-directory: relay
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run typecheck
          npm test

      - name: Audit, typecheck, unit tests, build
        working-directory: app
        env:
          # Optional: Settings > Variables > VEIL_DEFAULT_RELAY (e.g. https://relay.example.com)
          VITE_DEFAULT_RELAY: ${{ vars.VEIL_DEFAULT_RELAY }}
        run: |
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm test
          npm run build

      - name: End-to-end test (two real browsers over WebRTC)
        working-directory: app
        run: |
          npx playwright install --with-deps chromium
          SIZE_MB=8 npm run test:e2e

      - name: Package release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p _site/app release
          cp -r site/. _site/
          cp -r app/dist/. _site/app/
          touch _site/.nojekyll
          (cd app/dist && zip -qr -X "../../release/veil-app-$VERSION.zip" .)
          (cd _site && zip -qr -X "../release/veil-website-and-app-$VERSION.zip" .)
          (cd release && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # GitHub only supports attestations on public repos (or org-owned private repos on paid plans).
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          REPO: ${{ github.repository }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          flags=(--verify-tag --generate-notes --title "Veil $TAG")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          cat > notes.md <<NOTES
          **Use it:** https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/app/

          **Self-host:** unzip \`veil-app-$TAG.zip\` and serve it over HTTPS from any static host.

          **Verify:** \`sha256sum -c SHA256SUMS.txt\`
          NOTES
          if [ "$PRIVATE" != "true" ]; then
            echo "and \`gh attestation verify veil-app-$TAG.zip --repo $REPO\` (signed build provenance)" >> notes.md
          fi
          gh release create "$TAG" release/* --repo "$REPO" --notes-file notes.md "${flags[@]}"

  deploy:
    needs: [build, release]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  relay-image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/veil-relay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.build.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
