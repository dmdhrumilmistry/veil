name: Release

# Push a tag like v0.2.0 (matching app/package.json) to:
#   1. verify, test (unit + two-browser E2E) and build the app
#   2. publish a GitHub Release with zipped builds, SHA-256 checksums and signed build provenance
#   3. deploy the website (/) and app (/app/) to GitHub Pages (skipped for pre-releases like v1.0.0-rc.1)
#   4. build the Flutter Android app (APK attached to the release; signed with the release key
#      when ANDROID_KEYSTORE_* secrets are set, otherwise with a throwaway debug key)

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check tag matches app/package.json version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="v$(node -p "require('./app/package.json').version")"
          if [ "$TAG" != "$pkg" ]; then
            echo "::error::Tag $TAG does not match app/package.json version $pkg"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Audit, typecheck, unit tests, build
        working-directory: app
        run: |
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm test
          npm run build

      - name: End-to-end test (two real browsers over WebRTC)
        working-directory: app
        run: |
          npx playwright install --with-deps chromium
          SIZE_MB=8 npm run test:e2e

      - name: Package release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p _site/app release
          cp -r site/. _site/
          cp -r app/dist/. _site/app/
          touch _site/.nojekyll
          (cd app/dist && zip -qr -X "../../release/veil-app-$VERSION.zip" .)
          (cd _site && zip -qr -X "../release/veil-website-and-app-$VERSION.zip" .)
          (cd release && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # GitHub only supports attestations on public repos (or org-owned private repos on paid plans).
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Test protocol core
        working-directory: flutter/veil_core
        run: |
          dart pub get
          dart test
      - name: Configure release signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > flutter/app/android/key.properties
            echo "Signing with the release key"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key (fine for testing, not for store releases)"
          fi
      - name: Build APK
        working-directory: flutter/app
        run: |
          flutter pub get
          flutter test
          flutter build apk --release --build-name "${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/veil-android-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: ${{ runner.temp }}/veil-android-*.apk
          if-no-files-found: error

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: release
      - name: Checksum the APK too
        run: cd release && sha256sum *.apk >> SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          REPO: ${{ github.repository }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          flags=(--verify-tag --generate-notes --title "Veil $TAG")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          cat > notes.md <<NOTES
          **Use it:** https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/app/

          **Android:** install \`veil-android-$TAG.apk\` (allow installs from your browser or file manager).

          **Self-host:** unzip \`veil-app-$TAG.zip\` and serve it over HTTPS from any static host.

          **Verify:** \`sha256sum -c SHA256SUMS.txt\`
          NOTES
          if [ "$PRIVATE" != "true" ]; then
            echo "and \`gh attestation verify veil-app-$TAG.zip --repo $REPO\` (signed build provenance)" >> notes.md
          fi
          gh release create "$TAG" release/* --repo "$REPO" --notes-file notes.md "${flags[@]}"

  deploy:
    needs: [build, release]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
