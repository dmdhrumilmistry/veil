name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end (two real browsers over WebRTC)
        run: |
          npx playwright install --with-deps chromium
          SIZE_MB=8 npm run test:e2e

  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (Android + Flutter builds need room)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules/@aws-amplify || true
          docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: veil_core - analyze and test against the web app's vectors
        working-directory: flutter/veil_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      - name: Live interop - TypeScript handshake <-> Dart handshake
        run: |
          (cd flutter/veil_core && dart compile exe tool/interop_peer.dart -o "$RUNNER_TEMP/veil_interop_peer")
          cd app
          npm ci --ignore-scripts
          VEIL_DART_PEER="$RUNNER_TEMP/veil_interop_peer" npx vitest run test/interop.test.ts test/vectors.test.ts

      - name: Flutter app - analyze, test, build Android APK
        working-directory: flutter/app
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
          flutter build apk --debug
