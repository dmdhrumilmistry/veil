name: Redeploy GitHub Pages (manual / rollback)

# Normal deploys happen from the Release workflow when a version tag is pushed.
# Run this by hand to redeploy any tag or branch, e.g. to roll back to v0.1.0.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to deploy (e.g. v0.1.0)
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build app
        working-directory: app
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - name: Assemble site (landing page at /, app at /app/)
        run: |
          mkdir -p _site/app
          cp -r site/. _site/
          cp -r app/dist/. _site/app/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
