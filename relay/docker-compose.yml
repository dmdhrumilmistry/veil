# One-command deployment with automatic HTTPS:
#   VEIL_RELAY_DOMAIN=relay.example.com docker compose up -d
# Point your domain's DNS A/AAAA record at this server first (ports 80 and 443 open).
services:
  relay:
    image: ghcr.io/dmdhrumilmistry/veil-relay:latest
    build: .
    restart: unless-stopped
    environment:
      VEIL_RELAY_TRUST_PROXY: "1"
    volumes:
      - relay-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    networks: [internal]

  caddy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    depends_on: [relay]
    environment:
      VEIL_RELAY_DOMAIN: ${VEIL_RELAY_DOMAIN:?set VEIL_RELAY_DOMAIN to your relay hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

volumes:
  relay-data:
  caddy-data:
  caddy-config:

networks:
  internal:
